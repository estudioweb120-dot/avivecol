<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel AVIVECOL | Solicitudes</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --blue:#1B3A6B; --blue-deep:#132A4E; --gold:#F2B705; --green:#3B8C4A; --red:#C8362C;
    --cream:#FAF8F4; --panel:#F1ECE0; --ink:#2A2A28; --muted:#6B6A63; --line:rgba(27,58,107,0.14);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.6;min-height:100vh;}
  h1,h2,.serif{font-family:'Nunito',sans-serif;font-weight:800;color:var(--blue-deep);}
  .wrap{max-width:1040px;margin:0 auto;padding:40px 24px 90px;}

  header{border-bottom:1px solid var(--line);padding:18px 24px;display:flex;align-items:center;justify-content:space-between;background:#fff;}
  .brand{font-family:'Nunito',sans-serif;font-weight:800;font-size:16px;color:var(--blue-deep);}
  .brand span{display:block;font-size:10px;font-weight:600;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;margin-top:2px;}
  #logoutBtn{display:none;font-size:12px;font-weight:700;letter-spacing:.03em;background:none;border:1.5px solid var(--blue);padding:9px 16px;border-radius:20px;cursor:pointer;color:var(--blue);}
  #logoutBtn:hover{background:var(--blue);color:#fff;}

  #loginView{max-width:380px;margin:70px auto 0;}
  #loginView h1{font-size:24px;margin-bottom:8px;}
  #loginView p{color:var(--muted);font-size:14px;margin-bottom:28px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px;}
  .field input,.field select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;}
  .field input:focus{outline:none;border-color:var(--blue);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:24px;font-size:14px;font-weight:700;cursor:pointer;border:none;width:100%;font-family:'Nunito',sans-serif;background:var(--blue);color:#fff;}
  .btn:hover{background:var(--blue-deep);}
  .btn:disabled{opacity:.5;}
  #loginError{color:var(--red);font-size:13px;margin-top:14px;display:none;}

  #appView{display:none;}
  .tabs{display:flex;gap:10px;margin-bottom:26px;}
  .tab-btn{font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;padding:10px 18px;border-radius:20px;border:1.5px solid var(--line);background:#fff;cursor:pointer;color:var(--muted);}
  .tab-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
  .panel{display:none;}
  .panel.active{display:block;}

  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:14px;}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:14px;flex-wrap:wrap;}
  .card-head h3{font-size:16px;color:var(--blue-deep);}
  .card-head .date{font-size:12px;color:var(--muted);}
  .badge{font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;}
  .badge.pendiente{background:#FCEBCB;color:#8A5A00;}
  .badge.nuevo{background:#FCEBCB;color:#8A5A00;}
  .badge.en-revision{background:#DCE7F5;color:var(--blue);}
  .badge.aceptado,.badge.contactado{background:#E1F0E3;color:#256135;}
  .badge.rechazado{background:#FBE1DE;color:var(--red);}

  .detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 20px;font-size:13.5px;margin-bottom:12px;}
  @media(max-width:600px){.detail-grid{grid-template-columns:1fr;}}
  .detail-grid div{padding:8px 0;border-bottom:1px dashed var(--line);}
  .detail-grid .lbl{color:var(--muted);font-weight:600;display:block;font-size:11px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px;}
  .msg-box{background:var(--panel);border-radius:10px;padding:14px;font-size:13.5px;margin-top:8px;}

  .status-row{display:flex;gap:10px;align-items:center;margin-top:14px;}
  .status-row select{padding:8px 12px;border-radius:8px;border:1.5px solid var(--line);font-size:13px;font-family:inherit;}
  .status-row button{font-size:12px;font-weight:700;padding:8px 16px;border-radius:20px;border:none;background:var(--blue);color:#fff;cursor:pointer;font-family:'Nunito',sans-serif;}

  .empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px;}
</style>
</head>
<body>

<header>
  <div class="brand">AVIVECOL<span>Panel de solicitudes</span></div>
  <button id="logoutBtn">Cerrar sesión</button>
</header>

<div id="loginView">
  <h1>Ingresar</h1>
  <p>Accede para ver las solicitudes de afiliación y los mensajes de contacto.</p>
  <form id="loginForm">
    <div class="field"><label>Correo</label><input type="email" id="loginEmail" required autocomplete="username"></div>
    <div class="field"><label>Contraseña</label><input type="password" id="loginPassword" required autocomplete="current-password"></div>
    <button type="submit" class="btn" id="loginBtn">Entrar</button>
  </form>
  <p id="loginError">Correo o contraseña incorrectos.</p>
</div>

<div id="appView">
  <div class="wrap">
    <div class="tabs">
      <button class="tab-btn active" data-tab="afiliaciones">Solicitudes de afiliación</button>
      <button class="tab-btn" data-tab="contactos">Mensajes de contacto</button>
    </div>

    <div class="panel active" id="panel-afiliaciones"></div>
    <div class="panel" id="panel-contactos"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://jkhnhpljnkltyzpbwebg.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpraG5ocGxqbmtsdHl6cGJ3ZWJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNjIwNzcsImV4cCI6MjEwMjYzODA3N30.Pr5huTX-889fB9mvMui3LkUVj0ZL7cNPO7WyjkitenY";
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loginView = document.getElementById('loginView');
const appView = document.getElementById('appView');
const logoutBtn = document.getElementById('logoutBtn');

async function checkSession(){
  const { data } = await supa.auth.getSession();
  if (data.session) showApp(); else showLogin();
}
function showLogin(){ loginView.style.display='block'; appView.style.display='none'; logoutBtn.style.display='none'; }
function showApp(){ loginView.style.display='none'; appView.style.display='block'; logoutBtn.style.display='inline-flex'; loadAfiliaciones(); loadContactos(); }

document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Entrando...';
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const { error } = await supa.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Entrar';
  if (error) { err.style.display = 'block'; return; }
  showApp();
});
logoutBtn.addEventListener('click', async function(){ await supa.auth.signOut(); showLogin(); });

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

function fmtDate(d){
  if(!d) return '—';
  return new Date(d).toLocaleString('es-CO', {dateStyle:'medium', timeStyle:'short'});
}
function slug(s){ return (s||'pendiente').toLowerCase().replace(/\s+/g,'-'); }

async function loadAfiliaciones(){
  const panel = document.getElementById('panel-afiliaciones');
  const { data, error } = await supa.from('afiliaciones').select('*').order('fecha_solicitud', {ascending:false});
  if (error || !data || !data.length){ panel.innerHTML = '<div class="empty">No hay solicitudes de afiliación todavía.</div>'; return; }

  panel.innerHTML = '';
  data.forEach(r => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-head">
        <div><h3>${r.nombre||'Sin nombre'}</h3><div class="date">${fmtDate(r.fecha_solicitud)}</div></div>
        <span class="badge ${slug(r.estado)}">${r.estado||'pendiente'}</span>
      </div>
      <div class="detail-grid">
        <div><span class="lbl">Documento</span>${r.tipo_documento||'—'} ${r.numero_documento||''}</div>
        <div><span class="lbl">Fecha de nacimiento</span>${r.fecha_nacimiento||'—'}</div>
        <div><span class="lbl">Teléfono</span>${r.telefono||'—'}</div>
        <div><span class="lbl">Correo</span>${r.correo||'—'}</div>
        <div><span class="lbl">Ubicación</span>${r.municipio||''}, ${r.departamento||''}</div>
        <div><span class="lbl">Dirección</span>${r.direccion||'—'}</div>
        <div><span class="lbl">¿Víctima del conflicto?</span>${r.es_victima||'—'}</div>
        <div><span class="lbl">¿Registrado en RUV?</span>${r.registro_ruv||'—'}</div>
        <div><span class="lbl">Tipo de población</span>${r.tipo_poblacion||'—'}</div>
        <div><span class="lbl">Consentimiento de datos</span>${r.consentimiento_datos ? 'Sí' : 'No'}</div>
      </div>
      <div class="msg-box"><strong>Motivo:</strong> ${r.motivo_afiliacion||'—'}</div>
      ${r.acompanamiento ? `<div class="msg-box"><strong>Acompañamiento buscado:</strong> ${r.acompanamiento}</div>` : ''}
      <div class="status-row">
        <select data-id="${r.id}">
          <option ${r.estado==='pendiente'?'selected':''} value="pendiente">Pendiente</option>
          <option ${r.estado==='en revisión'?'selected':''} value="en revisión">En revisión</option>
          <option ${r.estado==='aceptado'?'selected':''} value="aceptado">Aceptado</option>
          <option ${r.estado==='rechazado'?'selected':''} value="rechazado">Rechazado</option>
        </select>
        <button data-id="${r.id}" class="save-estado">Guardar estado</button>
      </div>
    `;
    panel.appendChild(card);
  });

  panel.querySelectorAll('.save-estado').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const select = panel.querySelector(`select[data-id="${id}"]`);
      btn.disabled = true; btn.textContent = 'Guardando...';
      await supa.from('afiliaciones').update({ estado: select.value }).eq('id', id);
      loadAfiliaciones();
    });
  });
}

async function loadContactos(){
  const panel = document.getElementById('panel-contactos');
  const { data, error } = await supa.from('contactos').select('*').order('fecha', {ascending:false});
  if (error || !data || !data.length){ panel.innerHTML = '<div class="empty">No hay mensajes de contacto todavía.</div>'; return; }

  panel.innerHTML = '';
  data.forEach(r => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-head">
        <div><h3>${r.nombre||'Sin nombre'}</h3><div class="date">${fmtDate(r.fecha)}</div></div>
        <span class="badge ${slug(r.estado)}">${r.estado||'nuevo'}</span>
      </div>
      <div class="detail-grid">
        <div><span class="lbl">Correo</span>${r.correo||'—'}</div>
        <div><span class="lbl">Teléfono</span>${r.telefono||'—'}</div>
      </div>
      <div class="msg-box">${r.mensaje||'—'}</div>
      <div class="status-row">
        <select data-id="${r.id}">
          <option ${r.estado==='nuevo'?'selected':''} value="nuevo">Nuevo</option>
          <option ${r.estado==='contactado'?'selected':''} value="contactado">Contactado</option>
        </select>
        <button data-id="${r.id}" class="save-estado-c">Guardar estado</button>
      </div>
    `;
    panel.appendChild(card);
  });

  panel.querySelectorAll('.save-estado-c').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const select = panel.querySelector(`select[data-id="${id}"]`);
      btn.disabled = true; btn.textContent = 'Guardando...';
      await supa.from('contactos').update({ estado: select.value }).eq('id', id);
      loadContactos();
    });
  });
}

checkSession();
</script>
</body>
</html>
